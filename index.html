<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock"><img src="https://onkar2104.github.io/Rock_Paper_Scissors/rock.png"></div>
          <div class="choice" id="paper"><img src="https://kedar5045.github.io/rock-paper-scissor2/paper.png" ></div>
            <div class="choice" id="scissors"><img src="https://icebreaker1047.github.io/rock-paper-sciscord-webpage/Images/scissors.png"></div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>you</p>
        </div>

          <div class="score">
            <p id="comp-score">0</p>
            <p>comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">play your move</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
